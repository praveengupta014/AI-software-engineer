[project]
name = "countersign-backend"
version = "0.1.0"
description = "Countersign: AI software engineering agents that act only with human approval"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern
